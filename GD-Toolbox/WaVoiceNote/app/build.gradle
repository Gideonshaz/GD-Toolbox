plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gideon.gdtoolbox'
    compileSdk 34

    defaultConfig {
        applicationId "com.gideon.gdtoolbox"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // opusencoder ships native .so for these ABIs; keep the app lean to the phone's ABI set
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed / LSPosed API — compileOnly: provided by the framework at runtime, NOT bundled.
    compileOnly 'de.robv.android.xposed:api:82'

    // Element's libopusenc wrapper — the exact encoder WaEnhancer uses (Apache-2.0).
    implementation 'io.element.android:opusencoder:1.2.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
}
